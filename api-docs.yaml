openapi: 3.0.3
info:
  title: Dodo Payments — Invoice & Payment Service
  version: 1.0.0
  description: |
    Invoice & Payment Service API.
    All protected endpoints require `Authorization: Bearer <api_key>`.

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: invalid_state_transition
            message:
              type: string
              example: Cannot transition invoice from 'paid' state with action 'pay'

    Customer:
      type: object
      properties:
        id:          { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name:        { type: string }
        email:       { type: string, format: email }
        created_at:  { type: string, format: date-time }

    LineItem:
      type: object
      properties:
        id:                { type: string, format: uuid }
        invoice_id:        { type: string, format: uuid }
        description:       { type: string }
        quantity:          { type: integer, minimum: 1 }
        unit_amount_cents: { type: integer, minimum: 0, description: "Integer cents — no floats" }
        amount_cents:      { type: integer, minimum: 0, description: "quantity * unit_amount_cents, server-computed" }

    Invoice:
      type: object
      properties:
        id:          { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        status:
          type: string
          enum: [open, paid, void, uncollectible]
        total_cents: { type: integer, description: "Server-computed total in cents. Client-supplied totals are ignored." }
        due_date:    { type: string, format: date }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    InvoiceResponse:
      type: object
      properties:
        invoice:
          $ref: '#/components/schemas/Invoice'
        line_items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }

    PaymentAttempt:
      type: object
      properties:
        id:              { type: string, format: uuid }
        invoice_id:      { type: string, format: uuid }
        idempotency_key: { type: string }
        card_token:      { type: string }
        status:
          type: string
          enum: [pending, succeeded, failed]
        psp_ref:      { type: string, nullable: true, description: "PSP reference on success" }
        failure_code: { type: string, nullable: true, example: card_declined }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    WebhookEndpoint:
      type: object
      properties:
        id:          { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        url:         { type: string, format: uri }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }

    WebhookEndpointCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          properties:
            secret:
              type: string
              description: "HMAC signing secret — only returned on creation. Store it securely; it will never be shown again."

    WebhookDelivery:
      type: object
      properties:
        id:              { type: string, format: uuid }
        endpoint_id:     { type: string, format: uuid }
        event_type:
          type: string
          enum: [invoice.created, invoice.paid, invoice.payment_failed]
        payload:         { type: object, description: "Full event body" }
        status:
          type: string
          enum: [pending, delivered, failed]
        attempts:        { type: integer }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        last_error:      { type: string, nullable: true }
        created_at:      { type: string, format: date-time }

security:
  - BearerAuth: []

paths:
  /admin/businesses:
    post:
      summary: Create a business and get an API key
      security: []
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Business created. Save the api_key — it is only shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_id: { type: string, format: uuid }
                  api_key:     { type: string, description: "Raw key — only shown once" }
                  key_prefix:  { type: string, description: "First 9 chars for display/identification" }
                  note:        { type: string, example: "Save this API key — it will never be shown again" }

  /customers:
    post:
      summary: Create a customer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:  { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }

    get:
      summary: List all customers for the authenticated business
      tags: [Customers]
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }
        '401': { description: Unauthorized }

  /customers/{id}:
    get:
      summary: Get a customer by ID
      tags: [Customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Customer UUID
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { description: Unauthorized }
        '404': { description: Customer not found }

  /invoices:
    post:
      summary: Create an invoice with line items
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, due_date, line_items]
              properties:
                customer_id: { type: string, format: uuid }
                due_date:    { type: string, format: date }
                line_items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, quantity, unit_amount_cents]
                    properties:
                      description:       { type: string }
                      quantity:          { type: integer, minimum: 1 }
                      unit_amount_cents: { type: integer, minimum: 0, description: "Integer cents — no floats" }
      responses:
        '200':
          description: Invoice created in `open` state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Customer not found }

    get:
      summary: List invoices, optionally filtered by status
      tags: [Invoices]
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [open, paid, void, uncollectible]
          description: Filter invoices by state
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invoice' }
        '401': { description: Unauthorized }

  /invoices/{id}:
    get:
      summary: Get an invoice by ID, including line items
      tags: [Invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Invoice UUID
      responses:
        '200':
          description: Invoice with line items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
        '401': { description: Unauthorized }
        '404': { description: Invoice not found }

  /invoices/{id}/void:
    post:
      summary: Void an open invoice
      tags: [Invoices]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Invoice UUID
      responses:
        '200':
          description: Invoice voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { description: Unauthorized }
        '404': { description: Invoice not found }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invoices/{id}/pay:
    post:
      summary: Attempt to pay an invoice
      description: |
        Submits a payment attempt against the invoice. Must be idempotent — include a unique
        `Idempotency-Key` header. Retrying with the same key returns the original result
        without a second PSP call. Reusing the same key with a different request body
        returns `422 Unprocessable Entity`.
      tags: [Payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Invoice UUID
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
          description: Unique key for this payment attempt. Use a UUID per attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_token]
              properties:
                card_token:
                  type: string
                  enum: [tok_success, tok_insufficient_funds, tok_card_declined, tok_timeout, tok_network_error]
                  description: Mock card token. tok_timeout sleeps 30s — the service times out at 10s and returns a failed attempt.
      responses:
        '200':
          description: Payment attempt recorded. Check the `status` field for outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAttempt' }
        '401': { description: Unauthorized }
        '404': { description: Invoice not found }
        '409':
          description: Invoice is not in a payable state (already paid, void, or uncollectible)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Idempotency key reused with a different request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invoices/{id}/payment-attempts:
    get:
      summary: List all payment attempts for an invoice
      tags: [Payments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Invoice UUID
      responses:
        '200':
          description: Payment attempts ordered by created_at descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentAttempt' }
        '401': { description: Unauthorized }
        '404': { description: Invoice not found }

  /webhooks:
    post:
      summary: Register a webhook endpoint
      description: |
        Registers a URL to receive signed webhook events. The response includes a `secret`
        used to verify the HMAC-SHA256 signature on deliveries. The secret is only returned
        on creation — store it securely.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '200':
          description: Endpoint registered. Save the secret — it will not be shown again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointCreated' }
        '401': { description: Unauthorized }

    get:
      summary: List registered webhook endpoints
      tags: [Webhooks]
      responses:
        '200':
          description: List of webhook endpoints (secret not included)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { description: Unauthorized }

  /webhooks/{id}:
    delete:
      summary: Delete a webhook endpoint
      tags: [Webhooks]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Webhook endpoint UUID
      responses:
        '204': { description: Endpoint deleted }
        '401': { description: Unauthorized }
        '404': { description: Endpoint not found }

  /webhook-deliveries:
    get:
      summary: List webhook deliveries for reconciliation
      description: |
        Returns the delivery log for all webhook endpoints belonging to the authenticated
        business. Use `status=failed` to find deliveries that exhausted the retry budget.
        The full event payload is stored on each delivery for replay.
      tags: [Webhooks]
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, delivered, failed]
          description: Filter by delivery status
      responses:
        '200':
          description: Webhook delivery log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { description: Unauthorized }